<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
.main{background:var(--teal-700);display:grid;place-items:center}
.mark{font-family:var(--font-display);font-weight:800;font-size:150px;letter-spacing:-0.03em;color:#fff;line-height:1;white-space:nowrap}
.mark em{font-style:normal;color:var(--sun-400)}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div{width:100%;height:100%}</style></head>
<body><div class="main"><div class="mark">eddy<em>wallet</em></div></div>
<div class="strip"><div style="background:var(--sun-400)"></div><div style="background:var(--berry-500)"></div><div style="background:var(--sky-600)"></div><div style="background:var(--teal-950)"></div></div>
</body></html>
