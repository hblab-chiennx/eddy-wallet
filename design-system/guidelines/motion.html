<!-- @dsCard group="Shape" viewport="700x160" name="Motion" subtitle="90–240ms for UI; one springy overshoot for kid feedback; parents never bounce." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-app);font-family:var(--font-body);height:160px;box-sizing:border-box;overflow:hidden}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}.t{height:34px;width:34px;border-radius:var(--radius-sm);background:var(--brand-primary)}</style></head><body><div style="display:grid;gap:10px">
<div style="display:flex;gap:14px;align-items:center"><div style="width:230px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted)">--dur-fast 160ms · --ease-out</div><div class="t" style="background:var(--brand-primary);animation:slide 2.4s var(--ease-out) infinite;animation-duration:calc(var(--dur-fast) * 10)"></div></div><div style="display:flex;gap:14px;align-items:center"><div style="width:230px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted)">--dur-base 240ms · --ease-bounce</div><div class="t" style="background:var(--sun-500);animation:slide 2.4s var(--ease-bounce) infinite;animation-duration:calc(var(--dur-base) * 10)"></div></div><div style="display:flex;gap:14px;align-items:center"><div style="width:230px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted)">--dur-slow 420ms · --ease-in-out</div><div class="t" style="background:var(--grape-600);animation:slide 2.4s var(--ease-in-out) infinite;animation-duration:calc(var(--dur-slow) * 10)"></div></div>
</div>
<div style="font-size:12px;color:var(--text-muted);margin-top:10px">Reduced motion zeroes every duration token.</div></body></html>
