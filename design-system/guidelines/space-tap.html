<!-- @dsCard group="Spacing" viewport="700x160" name="Tap targets" subtitle="--tap-min 48px. Kid-facing controls never go below it." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-app);font-family:var(--font-body);height:160px;box-sizing:border-box;overflow:hidden}</style></head><body><div style="display:flex;gap:12px;align-items:center">
<div style="display:grid;place-items:center;width:var(--tap-min);height:var(--tap-min);border-radius:var(--radius-md);background:var(--brand-primary);color:#fff;font-weight:800;font-size:11px">48</div>
<div style="display:grid;place-items:center;width:44px;height:44px;border-radius:var(--radius-md);background:var(--surface-card);border:2px solid var(--border-strong);font-weight:800;font-size:11px;color:var(--text-body)">44</div>
<div style="display:grid;place-items:center;width:36px;height:36px;border-radius:var(--radius-sm);background:var(--ink-100);font-weight:800;font-size:11px;color:var(--text-muted)">36</div>
<div style="font-size:12px;color:var(--text-muted);max-width:420px">48px = kid buttons and PIN keys. 44px = icon buttons. 36px = parent-only dense toolbars on desktop, never in Child Mode.</div>
</div></body></html>
