<!-- @dsCard group="Shape" viewport="700x180" name="Sticker vs. card shadow" subtitle="Hard 3px offset for pressables; soft ambient for parent surfaces." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-app);font-family:var(--font-body);height:180px;box-sizing:border-box;overflow:hidden}</style></head><body><div style="display:flex;gap:16px;align-items:flex-start">
<div style="text-align:center"><div style="width:150px;height:56px;display:grid;place-items:center;background:var(--brand-primary);color:#fff;font-weight:800;border:2px solid var(--teal-800);border-radius:var(--radius-md);box-shadow:var(--shadow-sticker)">Rest</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px">--shadow-sticker</div></div>
<div style="text-align:center"><div style="width:150px;height:56px;margin-top:2px;display:grid;place-items:center;background:var(--brand-primary);color:#fff;font-weight:800;border:2px solid var(--teal-800);border-radius:var(--radius-md);box-shadow:var(--shadow-sticker-press)">Pressed</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px">press + translateY(2px)</div></div>
<div style="text-align:center"><div style="width:150px;height:56px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)"></div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px">--shadow-card</div></div>
<div style="text-align:center"><div style="width:150px;height:56px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-raised)"></div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px">--shadow-raised</div></div>
</div></body></html>
