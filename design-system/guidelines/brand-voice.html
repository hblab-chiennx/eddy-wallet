<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-app);font-family:var(--font-body);height:200px;box-sizing:border-box;overflow:hidden}</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1;background:var(--brand-primary-soft);border:2px solid var(--teal-200);border-radius:var(--radius-lg);padding:14px">

<div style="font-size:13px;color:var(--teal-800);margin-top:6px">Allowance lands Sunday — 3 days to go.<br>Nice work! You saved $8 this month.<br>That's not it. Try again!</div>
</div>
<div style="flex:1;background:var(--surface-parent);border:1px solid var(--sky-200);border-radius:var(--radius-lg);padding:14px">

<div style="font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--ink-900);margin-top:4px">Mia's balance: $42.50</div>

</div>
